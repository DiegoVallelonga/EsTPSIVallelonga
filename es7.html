<html>
<head>
  <title>Controllo Radio button Javascript</title>

  <script type="text/javascript">

    function stampa() {
      let nome = document.getElementById("fname").value;
      let cognome = document.getElementById("lname").value;
      let indirizzo = document.getElementById("address").value;
      let genere;

      for(i=0;i<document.getElementsByName("Genders").length;i++) {

        if(document.getElementsByName("Genders")[i].checked){

         genere = document.getElementsByName("Genders")[i].value   
        }
      }
      document.getElementById("risp").innerHTML="<tr><td>"+nome+"</td><td>"+cognome+"</td><td>"+indirizzo+"</td><td>"+genere+"</td></tr>"
    }
  </script>
</head>
<body>

  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname" value=""><br>

  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" value=""><br>
    
  <label for="address">Address:</label><br>
  <input type="text" id="address" add="address" value=""><br>

  <label for="lname">Gender:</label><br>
  <div style="margin-left:10px;">
    <input type="radio" name="Genders" value="M">Male<br>
    <input type="radio" name="Genders" value="F">Female<br>
    <input type="radio" name="Genders" value="O">Other<br>
  </div>

  <input type="button" value="Submit" onclick="stampa()">
  <input type="reset" value="Reset">
  
  <table id="risp"></table>
  
  </body>
</html>
